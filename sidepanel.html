<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TagLens</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="tl-panel">
    <div class="tl-header">
      <div class="tl-header-top">
        <div class="tl-brand">
          <svg class="tl-logo" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="url(#tl-logo-grad)" stroke-width="2">
            <defs>
              <linearGradient id="tl-logo-grad" x1="0" y1="0" x2="24" y2="24">
                <stop offset="0%" stop-color="#22d3ee" />
                <stop offset="55%" stop-color="#a78bfa" />
                <stop offset="100%" stop-color="#f472b6" />
              </linearGradient>
            </defs>
            <circle cx="11" cy="11" r="7.5"/>
            <line x1="16.2" y1="16.2" x2="21" y2="21" stroke-linecap="round"/>
            <circle cx="11" cy="11" r="2.5" fill="url(#tl-logo-grad)" stroke="none"/>
          </svg>
          <span class="tl-title">TagLens</span>
        </div>
        <div class="tl-header-actions">
          <span class="tl-live" id="liveDot" title="Live - updates as you browse">
            <span class="tl-live-ring"></span>
            <span class="tl-live-core"></span>
          </span>
          <button class="tl-icon-btn" id="exportBtn" title="Export report as JSON" aria-label="Export report as JSON">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button class="tl-icon-btn tl-danger-btn" id="clearDataBtn" title="Clear cookies, cache & storage for this site" aria-label="Clear site data">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
          <button class="tl-icon-btn" id="refreshBtn" title="Refresh now" aria-label="Refresh now">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
        </div>
      </div>
      <div class="tl-url-bar" id="urlBar">Loading…</div>
      <div class="tl-toast" id="toast" hidden></div>
    </div>

    <div class="tl-content" id="content">
      <div class="tl-loading">
        <div class="tl-spinner"></div>
        <span>Scanning page…</span>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
