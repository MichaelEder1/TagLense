<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TagLens - Icon Generator</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #0a0e16; color: #e8ecf6; }
    canvas { border: 1px solid #232c40; margin: 10px; border-radius: 8px; }
    .info { margin-top: 20px; color: #8a93ab; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; background: linear-gradient(120deg,#22d3ee,#a78bfa 55%,#f472b6); color: #0a0e16; border: none; border-radius: 8px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>TagLens Icon Generator</h1>
  <p>Click the button below to download all icon sizes. Mirrors the side panel's logo mark (dark base, cyan → violet → pink gradient lens) - keep the two in sync if you change one.</p>
  <div>
    <canvas id="c128" width="128" height="128"></canvas>
    <canvas id="c48" width="48" height="48"></canvas>
    <canvas id="c32" width="32" height="32"></canvas>
    <canvas id="c16" width="16" height="16"></canvas>
  </div>
  <button onclick="downloadAll()">Download All Icons</button>
  <div class="info">
    <p>After downloading, place the files in the <code>icons/</code> folder of the extension.</p>
  </div>

  <script>
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;

      function roundedRect(x, y, w, h, rad) {
        ctx.beginPath();
        ctx.moveTo(x + rad, y);
        ctx.arcTo(x + w, y, x + w, y + h, rad);
        ctx.arcTo(x + w, y + h, x, y + h, rad);
        ctx.arcTo(x, y + h, x, y, rad);
        ctx.arcTo(x, y, x + w, y, rad);
        ctx.closePath();
      }

      // Dark base, matching the side panel's own background - gradient is
      // reserved for the signature mark, not splashed across the whole tile.
      roundedRect(0, 0, size, size, size * 0.21);
      ctx.fillStyle = '#0a0e16';
      ctx.fill();
      ctx.save();
      ctx.clip();

      let g1 = ctx.createRadialGradient(size * 0.18, size * 0.12, 0, size * 0.18, size * 0.12, size * 0.62);
      g1.addColorStop(0, 'rgba(34,211,238,0.55)');
      g1.addColorStop(1, 'rgba(34,211,238,0)');
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, size, size);

      let g2 = ctx.createRadialGradient(size * 0.92, size * 0.95, 0, size * 0.92, size * 0.95, size * 0.62);
      g2.addColorStop(0, 'rgba(244,114,182,0.42)');
      g2.addColorStop(1, 'rgba(244,114,182,0)');
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, size, size);
      ctx.restore();

      // Signature mark: magnifying glass, same gradient as the side panel wordmark.
      const grad = ctx.createLinearGradient(size * 0.18, size * 0.14, size * 0.82, size * 0.86);
      grad.addColorStop(0, '#22d3ee');
      grad.addColorStop(0.55, '#a78bfa');
      grad.addColorStop(1, '#f472b6');

      const cx = size * 0.42, cy = size * 0.42, radius = size * 0.225;
      ctx.lineCap = 'round';
      ctx.strokeStyle = grad;
      ctx.lineWidth = size * 0.075;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + radius * 0.74, cy + radius * 0.74);
      ctx.lineTo(size * 0.8, size * 0.8);
      ctx.lineWidth = size * 0.088;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, size * 0.062, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    ['c128', 'c48', 'c32', 'c16'].forEach(id => {
      drawIcon(document.getElementById(id));
    });

    function downloadAll() {
      const sizes = [
        { id: 'c128', name: 'icon128.png' },
        { id: 'c48', name: 'icon48.png' },
        { id: 'c32', name: 'icon32.png' },
        { id: 'c16', name: 'icon16.png' }
      ];

      sizes.forEach(({ id, name }) => {
        const canvas = document.getElementById(id);
        const link = document.createElement('a');
        link.download = name;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
